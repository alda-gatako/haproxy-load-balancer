global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    retries 3
    option redispatch

frontend http_front
    bind *:80
    default_backend api_servers

backend api_servers
    balance roundrobin
    option httpchk GET /health
    server web01 web01:3000 check inter 2s fall 2 rise 2
    server web02 web02:3000 check inter 2s fall 2 rise 2

